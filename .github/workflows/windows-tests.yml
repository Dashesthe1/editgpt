name: Windows tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        shell: pwsh
        run: python -m pip install -e ".[capture,mcp,dev]"

      - name: Run unit and contract tests
        shell: pwsh
        run: python -m pytest
