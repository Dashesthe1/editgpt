[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "editgpt"
version = "0.1.0"
description = "GPT-centered professional editing system; Eyes v1 is the first milestone."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
capture = [
  "dxcam>=0.3.0",
  "opencv-python>=4.10",
]
mcp = [
  "mcp>=2,<3",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
editgpt-eyes = "editgpt.cli:main"
editgpt-eyes-mcp = "editgpt.mcp_server:main"
editgpt-control = "editgpt.orchestrator:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/editgpt"]
